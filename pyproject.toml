[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "stockagent-rag"
version = "0.1.0"
description = "A RAG-enhanced multi-agent financial trading simulation."
readme = "README.md"
requires-python = ">=3.11,<3.13"


dependencies = [
    "python-dotenv>=1.0,<2.0",
    "pypdf>=5.0",
]


[tool.setuptools.packages.find]
where = ["src"]
